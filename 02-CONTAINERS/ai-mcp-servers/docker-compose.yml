# =============================================================================
# Memory Services — AI MCP Servers
# Provides two memory backends:
#   claude-memory  — Anthropic memory_20250818 protocol (MCP stdio + REST bridge)
#   ai-memory      — ai-memory HTTP daemon for cross-agent use (port 9077)
#
# Usage (Nexus / WebTop):
#   docker compose -f 02-CONTAINERS/ai-mcp-servers/docker-compose.yml up -d
#
# Usage (Oracle ARM64):
#   docker compose -f 02-CONTAINERS/ai-mcp-servers/docker-compose.yml \
#     -f 01-DEPLOYMENT/oracle/memory-compose.override.yml up -d
# =============================================================================

version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # Anthropic Memory Tool handler
  # Exposes the memory_20250818 protocol as an MCP server (stdio).
  # Also used by the install script for direct binary invocation.
  # ---------------------------------------------------------------------------
  claude-memory:
    build:
      context: ./claude-memory
      dockerfile: Dockerfile
    container_name: claude-memory
    restart: unless-stopped
    volumes:
      - claude-memory-data:/memories
    environment:
      - MEMORY_ROOT=/memories
    labels:
      - "traefik.enable=false"

  # ---------------------------------------------------------------------------
  # ai-memory HTTP daemon
  # Runs ai-memory in server mode (port 9077) for other AI agents and tools.
  # Claude Code connects to ai-memory via local stdio binary (see install script).
  # ---------------------------------------------------------------------------
  ai-memory:
    build:
      context: ./ai-memory
      dockerfile: Dockerfile
    container_name: ai-memory
    restart: unless-stopped
    ports:
      - "127.0.0.1:9077:9077"
    volumes:
      - ai-memory-data:/data
    environment:
      - AI_MEMORY_DB=/data/ai-memory.db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-memory.rule=Host(`memory.shannonjlove.cloud`)"
      - "traefik.http.routers.ai-memory.tls.certresolver=letsencrypt"
      - "traefik.http.services.ai-memory.loadbalancer.server.port=9077"

volumes:
  claude-memory-data:
  ai-memory-data:
