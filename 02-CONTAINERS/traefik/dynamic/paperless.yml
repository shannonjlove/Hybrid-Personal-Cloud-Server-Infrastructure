# Traefik file-provider route for Paperless-NGX
# Paperless runs under Podman Quadlets — not Docker — so Traefik cannot
# discover it via Docker labels. This static file config bridges the gap.
#
# Traefik's docker-compose service must include:
#   extra_hosts: ["host.docker.internal:host-gateway"]
# which maps host.docker.internal → the Docker host's IP (172.17.0.1 or similar),
# making Paperless's published port 8000 reachable from inside the Traefik container.

http:
  routers:
    paperless:
      rule: "Host(`paperless.shannonjlove.cloud`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: paperless
      middlewares:
        - paperless-security-headers

  services:
    paperless:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8000"
        healthCheck:
          path: /
          interval: 30s
          timeout: 5s

  middlewares:
    paperless-security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
