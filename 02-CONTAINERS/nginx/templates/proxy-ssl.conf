# SJL Managed — __SERVICE_NAME__
# Generated by sjl-nginx-proxy.sh — do not edit by hand.
# Certbot will append the SSL stanza below when --ssl is used.

server {
    listen 80;
    server_name __DOMAIN__;

    # Certbot challenge (leave accessible before cert is issued)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2  on;
    server_name __DOMAIN__;

    # Certbot manages these paths; leave as placeholders until first run.
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header X-XSS-Protection          "1; mode=block"                        always;
    add_header Referrer-Policy           "same-origin"                          always;

    location / {
        proxy_pass         http://__UPSTREAM__;
        proxy_http_version 1.1;

        # WebSocket support (required for WebTop / KasmVNC)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
        client_max_body_size 0;
    }
}
