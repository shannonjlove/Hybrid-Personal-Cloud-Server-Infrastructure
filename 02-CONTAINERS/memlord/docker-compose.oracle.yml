# memlord — Oracle sOs deployment
# Deploy at: ~/memlord/docker-compose.yml on ubuntu@150.136.77.26
#
# Usage:
#   cp .env.example .env && nano .env   # fill in secrets
#   docker compose up -d

services:

  memlord:
    image: ghcr.io/myrikld/memlord:latest
    container_name: memlord
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - memlord-onnx:/app/src/memlord/onnx
    environment:
      - MEMLORD_DB_URL=postgresql+asyncpg://postgres:${MEMLORD_DB_PASS}@postgres/memlord
      - MEMLORD_HOST=0.0.0.0
      - MEMLORD_PORT=8000
      - MEMLORD_BASE_URL=${MEMLORD_BASE_URL:-http://100.67.229.94:8000}
      - MEMLORD_OAUTH_JWT_SECRET=${MEMLORD_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg17
    container_name: memlord-db
    restart: unless-stopped
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${MEMLORD_DB_PASS}
      - POSTGRES_DB=memlord
    volumes:
      - memlord-db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "memlord", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  memlord-onnx:
  memlord-db-data:
