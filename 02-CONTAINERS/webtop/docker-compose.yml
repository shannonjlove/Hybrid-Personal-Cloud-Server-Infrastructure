# WebTop — browser-accessible Linux desktop (linuxserver.io)
# Runs on the VPS (Nexus) alongside existing services.
# Access at: https://desktop.shannonjlove.cloud
#
# Includes Claude Desktop + Node.js for MCP tool support.
# MCP config is bind-mounted from ./mcp-config.json
#
# Ollama runs as a sibling service on the shared `webtop-net` network.
# mcp-ollama (uvx) inside WebTop reaches it at http://ollama:11434

services:

  webtop:
    image: lscr.io/linuxserver/webtop:ubuntu-kde
    container_name: webtop
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-America/Chicago}
      - TITLE=Shannon Cloud Desktop
    volumes:
      - webtop-data:/config
      - ./mcp-config.json:/config/.config/Claude/claude_desktop_config.json:ro
      - ./init/install-uv.sh:/config/custom-cont-init.d/install-uv.sh:ro
      - ./init/install-media-tools.sh:/config/custom-cont-init.d/install-media-tools.sh:ro
      - ./init/install-oci-mcp.sh:/config/custom-cont-init.d/install-oci-mcp.sh:ro
    shm_size: "1gb"
    networks:
      - webtop-net
      - default
    depends_on:
      - ollama
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webtop.rule=Host(`desktop.shannonjlove.cloud`)"
      - "traefik.http.routers.webtop.tls.certresolver=letsencrypt"
      - "traefik.http.services.webtop.loadbalancer.server.port=3000"
      - "traefik.http.routers.webtop.middlewares=webtop-auth"
      - "traefik.http.middlewares.webtop-auth.basicauth.users=${WEBTOP_BASIC_AUTH}"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - webtop-net
    # GPU support (uncomment if the host has NVIDIA drivers + nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  webtop-data:
  ollama-data:

networks:
  webtop-net:
    driver: bridge
