# =============================================================================
# Hybrid Personal Cloud Server Infrastructure
# Master Docker Compose 2
 Service Definitions
# =============================================================================
# IMPORTANT: This is a sanitized template. Replace all placeholder values
# with actual configuration before deployment.
# Never commit real credentials to this repository.
# =============================================================================

version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # REVERSE PROXY
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./02-CONTAINERS/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./02-CONTAINERS/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-certs:/letsencrypt
    labels:
      - "traefik.enable=true"

  # ---------------------------------------------------------------------------
  # DOCUMENTATION
  # ---------------------------------------------------------------------------
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: unless-stopped
    environment:
      - APP_URL=https://docs.shannonjlove.cloud
      - DB_HOST=bookstack-db
      - DB_DATABASE=${BOOKSTACK_DB_NAME}
      - DB_USERNAME=${BOOKSTACK_DB_USER}
      - DB_PASSWORD=${BOOKSTACK_DB_PASS}
    volumes:
      - bookstack-data:/config
    depends_on:
      - bookstack-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookstack.rule=Host(`docs.shannonjlove.cloud`)"
      - "traefik.http.routers.bookstack.tls.certresolver=letsencrypt"

  bookstack-db:
    image: mariadb:latest
    container_name: bookstack-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${BOOKSTACK_DB_ROOT_PASS}
      - MYSQL_DATABASE=${BOOKSTACK_DB_NAME}
      - MYSQL_USER=${BOOKSTACK_DB_USER}
      - MYSQL_PASSWORD=${BOOKSTACK_DB_PASS}
    volumes:
      - bookstack-db-data:/var/lib/mysql

  # ---------------------------------------------------------------------------
  # MEMORY MCP — memlord
  # ---------------------------------------------------------------------------
  memlord:
    image: ghcr.io/myrikld/memlord:latest
    container_name: memlord
    restart: unless-stopped
    volumes:
      - memlord-onnx:/app/src/memlord/onnx
    environment:
      - MEMLORD_DB_URL=postgresql+asyncpg://postgres:${MEMLORD_DB_PASS}@memlord-db/memlord
      - MEMLORD_HOST=0.0.0.0
      - MEMLORD_PORT=8000
      - MEMLORD_BASE_URL=https://memory.shannonjlove.cloud
      - MEMLORD_OAUTH_JWT_SECRET=${MEMLORD_JWT_SECRET}
    depends_on:
      memlord-db:
        condition: service_healthy
        restart: true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memlord.rule=Host(`memory.shannonjlove.cloud`)"
      - "traefik.http.routers.memlord.tls.certresolver=letsencrypt"
      - "traefik.http.services.memlord.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  memlord-db:
    image: pgvector/pgvector:pg17
    container_name: memlord-db
    restart: unless-stopped
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${MEMLORD_DB_PASS}
      - POSTGRES_DB=memlord
    volumes:
      - memlord-db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "memlord", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # PHOTO MANAGEMENT
  # ---------------------------------------------------------------------------
  photoprism:
    image: photoprism/photoprism:latest
    container_name: photoprism
    restart: unless-stopped
    environment:
      - PHOTOPRISM_ADMIN_PASSWORD=${PHOTOPRISM_ADMIN_PASS}
      - PHOTOPRISM_SITE_URL=https://photos.shannonjlove.cloud
    volumes:
      - photoprism-data:/photoprism/storage
      - ~/Pictures:/photoprism/originals:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.photoprism.rule=Host(`photos.shannonjlove.cloud`)"
      - "traefik.http.routers.photoprism.tls.certresolver=letsencrypt"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  traefik-certs:
  bookstack-data:
  bookstack-db-data:
  photoprism-data:
  memlord-onnx:
  memlord-db-data:
