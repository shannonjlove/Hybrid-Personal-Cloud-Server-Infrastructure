# =============================================================================
# All services on this infrastructure run as Podman Quadlets (systemd units).
# There is no Docker on this server.
#
# Quadlet files live in each service directory under 02-CONTAINERS/:
#   02-CONTAINERS/nginx-proxy-manager/quadlets/
#   02-CONTAINERS/bookstack/quadlets/
#   02-CONTAINERS/photoprism/quadlets/
#   02-CONTAINERS/paperless-ngx/quadlets/
#
# Install all quadlets: sudo 02-CONTAINERS/scripts/deploy-all.sh
# =============================================================================
