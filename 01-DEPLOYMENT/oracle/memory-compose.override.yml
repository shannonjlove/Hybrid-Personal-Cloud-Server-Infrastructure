# Oracle Cloud (sOs) — ARM64 / aarch64
# Forces linux/arm64 platform for both memory services.
# Access via Tailscale: ssh ubuntu@sOs

version: "3.9"

services:
  claude-memory:
    platform: linux/arm64
    volumes:
      - /opt/claude-memory/memories:/memories
    restart: unless-stopped

  ai-memory:
    platform: linux/arm64
    volumes:
      - /opt/ai-memory/data:/data
    environment:
      - AI_MEMORY_DB=/opt/ai-memory/data/ai-memory.db
    ports:
      - "127.0.0.1:9077:9077"
    labels:
      - "traefik.enable=false"
    restart: unless-stopped
