# Hostinger VPS (Nexus) — x86_64
# No platform override needed; default amd64 build applies.
# WebTop container on this host shares the same memory volumes.

version: "3.9"

services:
  claude-memory:
    volumes:
      - /opt/claude-memory/memories:/memories
    restart: unless-stopped

  ai-memory:
    volumes:
      - /opt/ai-memory/data:/data
    environment:
      - AI_MEMORY_DB=/opt/ai-memory/data/ai-memory.db
    restart: unless-stopped
