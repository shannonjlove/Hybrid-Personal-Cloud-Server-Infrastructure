worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # WebDAV — Working Copy iOS (internal only, Tailscale-gated)
    server {
        listen 80;
        server_name files.shannonjlove.cloud;

        location / {
            proxy_pass http://127.0.0.1:8181;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Nexus landing / health
    server {
        listen 80 default_server;
        server_name nexus.shannonjlove.cloud _;

        location /health {
            return 200 'nexus ok\n';
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://docs.shannonjlove.cloud;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
